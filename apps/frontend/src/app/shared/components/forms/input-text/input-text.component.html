<div class="input-text" [ngClass]="{ 'has-error': error(), success: success(), disabled: isDisabled() }">
  <div class="input-text_header">
    <label [for]="id()">{{ label() }}</label>

    <div class="input-text_header_right">
      <ng-content select="[right]"></ng-content>
    </div>
  </div>

  <input
    #inputHTML
    [value]="value()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [disabled]="isDisabled()"
    [id]="id()"
    [required]="required()"
    [name]="id()"
    [type]="type()"
    [mask]="mask()"
    [placeholder]="placeholder()"
    [attr.aria-invalid]="error()"
    [attr.aria-label]="label()"
    [attr.aria-describedby]="describeBy() || null"
  />
</div>
