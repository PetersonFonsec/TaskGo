<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <span class="footer__mark" aria-hidden="true">T</span>
      <div>
        <strong class="footer__name">TaskGo</strong>
        <p class="footer__tagline">Serviços de casa, perto de você.</p>
      </div>
    </div>

    <nav class="footer__nav" aria-label="Institucional">
      <ul class="footer__links">
        @for (item of links; track item.link) {
          <li><a class="footer__link" [routerLink]="item.link">{{ item.label }}</a></li>
        }
      </ul>
    </nav>

    <p class="footer__legal">
      © {{ year }} TaskGo. Todos os direitos reservados.
    </p>
  </div>
</footer>
