<tg-app-bar [homeLink]="navigation()?.home ?? '/'">
  <!-- Um elemento por bloco, para o tg-nav cair no slot dele no tg-app-bar. -->
  @if (navigation(); as nav) {
    <tg-nav [items]="nav.destinations" [account]="nav.account" />
  }
  @if (navigation(); as nav) {
    <div class="header__actions">
      <app-notification />
      <tg-account-menu
        [name]="name()"
        [detail]="nav.roleLabel"
        [photo]="photo()"
        [links]="nav.accountLinks"
        (signOut)="signOut()"
      />
    </div>
  }
</tg-app-bar>
