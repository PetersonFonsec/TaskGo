<form id="service-form">
  <header id="service-form_header">
    <h2 class="main-title">Quais são suas especialidades?</h2>
    <p class="text">
      Depois do cadastro, configure preço e horários das suas ofertas antes de ativá-las.
    </p>
  </header>

  <h3 class="subtitle">Serviços</h3>
  <div id="service-form_content">
    @for (service of services(); track $index) {
      <app-input-checkbox
        [id]="'service-' + service.id"
        [name]="'service-' + service.id"
        [value]="service.id.toString()"
        (change)="addSubCategory(service)"
      >
        {{ service.name }}
      </app-input-checkbox>
    }
  </div>

  <footer id="service-form_footer">
    <app-button-back color="primary" />
    <app-button [disabled]="!serviceSelected().size" (click)="addServiceSelected()" color="primary">
      Adicionar serviços
    </app-button>
  </footer>
</form>
