<div class="auth__screen">
  <a class="auth__back" routerLink="/authenticate/register">
    <tg-icon name="arrow-left" [size]="16" />
    Voltar para Criar conta
  </a>

  <header class="auth__header">
    <p class="auth__eyebrow">Passo 1</p>
    <h1 class="auth__title">Seu perfil</h1>
    <p class="auth__lead">Seus dados de acesso e de contato. O CPF não aparece para ninguém.</p>
  </header>

  <form class="auth__form" novalidate (submit)="$event.preventDefault(); saveProfile()">
    <tg-field label="Nome completo" [error]="errors().name">
      <input #nameInput tgInput id="name-input" name="name" placeholder="Ana Souza" autocomplete="name" [ngModel]="name()" (ngModelChange)="name.set($event)" />
    </tg-field>

    <tg-field label="E-mail" [error]="errors().email">
      <input
        #emailInput
        tgInput
        id="email-input"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="nome@email.com"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </tg-field>

    <tg-field label="Celular" [error]="errors().phone">
      <input
        #phoneInput
        tgInput
        id="phone-input"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel-national"
        mask="(00) 0 0000-0000"
        placeholder="(11) 9 1234-5678"
        [ngModel]="phone()"
        (ngModelChange)="phone.set($event)"
      />
    </tg-field>

    <tg-field label="CPF" [error]="errors().cpf">
      <input
        #cpfInput
        tgInput
        id="documentNumber-input"
        name="cpf"
        inputmode="numeric"
        mask="000.000.000-00"
        placeholder="000.000.000-00"
        [ngModel]="cpf()"
        (ngModelChange)="cpf.set($event)"
      />
    </tg-field>

    <tg-field label="Senha" [hint]="'Pelo menos ' + passwordMin + ' caracteres.'" [error]="errors().password">
      <input
        #passwordInput
        tgInput
        id="password-input"
        name="password"
        placeholder="Crie uma senha"
        type="password"
        autocomplete="new-password"
        maxlength="72"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />
      <tg-password-toggle tgSuffix />
    </tg-field>

    <tg-field label="Confirmar senha" [error]="errors().confirmPassword">
      <input
        #confirmInput
        tgInput
        id="confirmPassword-input"
        name="confirmPassword"
        placeholder="Digite a senha de novo"
        type="password"
        autocomplete="new-password"
        maxlength="72"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
      />
      <tg-password-toggle tgSuffix />
    </tg-field>

    <button tgButton id="profile-submit" type="submit" size="lg" fullWidth>Salvar e voltar</button>
  </form>
</div>
