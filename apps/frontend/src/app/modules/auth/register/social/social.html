<div class="auth__screen">
  <a class="auth__back" routerLink="/authenticate/register">
    <tg-icon name="arrow-left" [size]="16" />
    Voltar para Criar conta
  </a>

  <header class="auth__header">
    <p class="auth__eyebrow">Passo 2</p>
    <h1 class="auth__title">Contato e redes</h1>
    <p class="auth__lead">Ajuda quem vai te contratar (ou atender) a te conhecer. Tudo aqui é opcional.</p>
  </header>

  <form class="auth__form" novalidate (submit)="$event.preventDefault(); saveSocial()">
    <tg-field label="WhatsApp" optional [error]="whatsappError()">
      <input
        #whatsappInput
        tgInput
        id="whatsapp-input"
        name="whatsapp"
        type="tel"
        inputmode="tel"
        autocomplete="tel-national"
        mask="(00) 0 0000-0000"
        placeholder="(11) 9 1234-5678"
        [ngModel]="whatsapp()"
        (ngModelChange)="whatsapp.set($event)"
      />
    </tg-field>

    <tg-field label="Instagram" optional>
      <span tgPrefix aria-hidden="true">&#64;</span>
      <input
        tgInput
        id="instagram-input"
        name="instagram"
        autocapitalize="none"
        placeholder="seu.perfil"
        [ngModel]="instagram()"
        (ngModelChange)="instagram.set(handle($event))"
      />
    </tg-field>

    <tg-field label="Facebook" optional>
      <input
        tgInput
        id="facebook-input"
        name="facebook"
        autocapitalize="none"
        placeholder="facebook.com/seu.perfil"
        [ngModel]="facebook()"
        (ngModelChange)="facebook.set($event)"
      />
    </tg-field>

    <tg-field label="LinkedIn" optional>
      <input
        tgInput
        id="linkedin-input"
        name="linkedin"
        autocapitalize="none"
        placeholder="linkedin.com/in/seu-perfil"
        [ngModel]="linkedin()"
        (ngModelChange)="linkedin.set($event)"
      />
    </tg-field>

    <button tgButton id="social-submit" type="submit" size="lg" fullWidth>Salvar e voltar</button>
  </form>
</div>
