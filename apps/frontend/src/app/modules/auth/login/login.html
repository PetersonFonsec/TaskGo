<div class="login">
  <header class="auth__header">
    <h1 class="auth__title">Entrar</h1>
    <p class="auth__lead">Use o e-mail e a senha da sua conta.</p>
  </header>

  @if (error()) {
    <tg-alert tone="danger" title="Não foi possível entrar">{{ error() }}</tg-alert>
  }

  <form class="login__form" novalidate (submit)="$event.preventDefault(); login()">
    <tg-field label="E-mail" [error]="emailError()">
      <input
        #emailInput
        tgInput
        id="login-email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="nome@email.com"
        [value]="email()"
        (input)="setValue('email', $event)"
      />
    </tg-field>

    <div class="login__password">
      <tg-field label="Senha" [error]="passwordError()">
        <input
          #passwordInput
          tgInput
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          [value]="password()"
          (input)="setValue('password', $event)"
        />
        <tg-password-toggle tgSuffix />
      </tg-field>
      <a id="forgot-password-link" class="login__forgot" routerLink="/authenticate/forgot-password">Esqueci minha senha</a>
    </div>

    <button tgButton id="login-submit" type="submit" size="lg" fullWidth [loading]="loading()">Entrar</button>
  </form>

  <p class="login__footer">
    Ainda não tem conta?
    <a id="register-link" routerLink="/authenticate/register">Criar conta</a>
  </p>
</div>
