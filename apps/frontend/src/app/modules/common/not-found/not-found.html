<app-page>
  <section class="not-found" aria-labelledby="not-found-title">
    <img
      class="not-found__illustration"
      src="/ilustrations/not-found-ilustration.webp"
      alt=""
      width="700"
      height="470"
    />

    <div class="not-found__body">
      <p class="not-found__code">Erro 404</p>
      <h1 id="not-found-title" class="not-found__title">Página não encontrada</h1>
      <p class="not-found__text">
        O endereço que você abriu não existe ou mudou de lugar. Confira o link ou siga por aqui.
      </p>
    </div>

    <div class="not-found__actions">
      <a tgButton iconStart="house" [routerLink]="home()">Ir para o início</a>
      <button tgButton type="button" appearance="outline" iconStart="arrow-left" (click)="back()">Voltar</button>
    </div>

    <p class="not-found__help">
      Precisa de ajuda? <a routerLink="/institutional/support">Fale com o suporte</a>
    </p>
  </section>
</app-page>
