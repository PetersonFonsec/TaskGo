<form [id]="formId()" class="address-form" novalidate (ngSubmit)="submit()">
  <fieldset class="address-form__fields" [disabled]="saving()">
    <legend class="address-form__sr">Dados do endereço</legend>

    <tg-field label="Nome do endereço" [error]="errors().label">
      <input
        tgInput
        id="address-label-input"
        name="label"
        autocomplete="off"
        placeholder="Casa, Trabalho…"
        [(ngModel)]="payload.label"
      />
    </tg-field>

    <tg-field label="CEP" [error]="errors().cep" [hint]="lookingUpCep() ? 'Buscando o endereço pelo CEP…' : ''">
      <input
        tgInput
        id="address-cep-input"
        name="cep"
        inputmode="numeric"
        autocomplete="postal-code"
        mask="00000-000"
        placeholder="00000-000"
        [ngModel]="payload.cep"
        (ngModelChange)="onCepChange($event)"
      />
    </tg-field>

    @if (cepError(); as message) {
      <tg-alert tone="warning">{{ message }}</tg-alert>
    }

    <tg-field label="Rua" [error]="errors().street">
      <input
        tgInput
        id="address-street-input"
        name="street"
        autocomplete="address-line1"
        placeholder="Rua das Flores"
        [(ngModel)]="payload.street"
      />
    </tg-field>

    <div class="address-form__row address-form__row--number">
      <tg-field label="Número" [error]="errors().number">
        <input
          tgInput
          id="address-number-input"
          name="number"
          placeholder="123"
          [(ngModel)]="payload.number"
        />
      </tg-field>
      <tg-field label="Complemento" optional>
        <input
          tgInput
          id="address-complement-input"
          name="complement"
          autocomplete="address-line2"
          placeholder="Apto 12, bloco B"
          [(ngModel)]="payload.complement"
        />
      </tg-field>
    </div>

    <tg-field label="Bairro (opcional)">
      <input
        tgInput
        id="address-neighborhood-input"
        name="neighborhood"
        autocomplete="address-level3"
        [(ngModel)]="payload.neighborhood"
      />
    </tg-field>

    <div class="address-form__row address-form__row--city">
      <tg-field label="Cidade" [error]="errors().city">
        <input
          tgInput
          id="address-city-input"
          name="city"
          autocomplete="address-level2"
          placeholder="São Paulo"
          [(ngModel)]="payload.city"
        />
      </tg-field>
      <tg-field label="Estado" [error]="errors().state">
        <input
          tgInput
          id="address-state-input"
          name="state"
          autocomplete="address-level1"
          placeholder="SP"
          [(ngModel)]="payload.state"
        />
      </tg-field>
    </div>

    <label class="address-form__default">
      <input type="checkbox" name="isDefault" [(ngModel)]="payload.isDefault" />
      <span>
        <span class="address-form__default-title">Usar como endereço principal</span>
        <span class="address-form__default-hint">Ele vem escolhido quando você busca e contrata serviços.</span>
      </span>
    </label>
  </fieldset>
</form>
