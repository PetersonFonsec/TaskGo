<form [id]="formId" #form="ngForm" (ngSubmit)="form.valid && createAddress()" class="address-form">
  @if (showHeader()) {
    <header class="address-form_header">
      <h2>{{ initialAddress() ? 'Editar endereço' : 'Adicionar endereço' }}</h2>
    </header>
  }
  <div class="address-form_content">
    <app-input-text
      name="label"
      id="address-label"
      label="Nome do endereço"
      [(ngModel)]="payload.label"
      [required]="true"
    />
    <app-input-text
      name="cep"
      id="address-cep"
      label="CEP"
      [ngModel]="payload.cep"
      (ngModelChange)="onCepChange($event)"
      mask="00000-000"
      placeholder="00000-000"
      pattern="[0-9]{5}-?[0-9]{3}"
      [required]="true"
    />
    <app-input-text
      name="street"
      id="address-street"
      label="Rua"
      [(ngModel)]="payload.street"
      [required]="true"
    />
    <app-input-text
      name="number"
      id="address-number"
      label="Número"
      [(ngModel)]="payload.number"
      [required]="true"
    />
    <app-input-text
      name="complement"
      id="address-complement"
      label="Complemento"
      [(ngModel)]="payload.complement"
    />
    <app-input-text
      name="neighborhood"
      id="address-neighborhood"
      label="Bairro"
      [(ngModel)]="payload.neighborhood"
    />
    <app-input-text
      name="city"
      id="address-city"
      label="Cidade"
      [(ngModel)]="payload.city"
      [required]="true"
    />
    <app-input-text
      name="state"
      id="address-state"
      label="Estado"
      [(ngModel)]="payload.state"
      [required]="true"
    />
  </div>
  <label class="address-form_default">
    <input type="checkbox" name="isDefault" [(ngModel)]="payload.isDefault" [disabled]="saving()" />
    Usar como endereço padrão
  </label>
  @if (lookingUpCep()) {
    <p role="status">Buscando endereço pelo CEP...</p>
  }
  @if (cepError()) {
    <p role="alert">{{ cepError() }}</p>
  }
  <ng-template #actions>
    <div class="address-form_footer">
      <app-button
        type="submit"
        [form]="formId"
        [disabled]="!!form.invalid || saving() || lookingUpCep()"
        color="primary"
        >{{ saving() ? 'Salvando...' : 'Salvar endereço' }}</app-button
      >
      <app-button
        type="button"
        color="light"
        [disabled]="saving()"
        (click)="!saving() && cancel.emit()"
        >Cancelar</app-button
      >
    </div>
  </ng-template>
  @if (showActions()) {
    <ng-container [ngTemplateOutlet]="actions" />
  }
</form>
