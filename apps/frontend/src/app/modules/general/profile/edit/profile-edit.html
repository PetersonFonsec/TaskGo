<div class="profile-edit">
  <div *ngIf="loading()">Carregando...</div>

  <div *ngIf="!loading() && user()">
    <h1>Editar perfil</h1>

    <form #form="ngForm" (ngSubmit)="save(form)">
      <app-input-text
        name="name"
        label="Nome"
        [(ngModel)]="nameValue"
        [required]="true"
      ></app-input-text>

      <app-input-text
        name="email"
        label="Email"
        type="text"
        [(ngModel)]="emailValue"
        [required]="true"
      ></app-input-text>

      <app-input-text
        name="phone"
        label="Telefone"
        type="text"
        [(ngModel)]="phoneValue"
        [required]="true"
      ></app-input-text>

      <div class="status-line" *ngIf="user()?.emailVerified === false">
        Email atual pendente de verificação
      </div>
      <div class="status-line" *ngIf="user()?.phoneVerified === false">
        Telefone atual pendente de verificação
      </div>

      <div class="form-messages">
        <p class="success" *ngIf="success()">{{ success() }}</p>
        <p class="error" *ngIf="error()">{{ error() }}</p>
      </div>

      <div class="actions">
        <button app-button type="button" (click)="cancel()">Cancelar</button>
        <button app-button type="submit">Salvar</button>
      </div>
    </form>
  </div>
</div>

<section aria-label="Alterar e-mail de acesso">
  <h2>Alterar e-mail de acesso</h2>
  <label for="email-change-password">Senha atual</label>
  <input
    id="email-change-password"
    type="password"
    autocomplete="current-password"
    [(ngModel)]="currentPassword"
  />
  <button type="button" (click)="requestEmailChange()">Enviar código ao novo e-mail</button>
  <label for="email-change-code">Código de confirmação</label>
  <input
    id="email-change-code"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    [(ngModel)]="verificationCode"
  />
  <button type="button" (click)="confirmEmailChange()">Confirmar alteração de e-mail</button>
</section>
