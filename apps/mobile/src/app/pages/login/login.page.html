<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/" text="" icon="tg-arrow-left" /></ion-buttons>
    <ion-title>Entrar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="login" [formGroup]="form" (ngSubmit)="submit()">
    <ion-list class="login__fields" lines="none">
      <ion-input
        formControlName="email"
        type="email"
        label="E-mail"
        labelPlacement="floating"
        fill="outline"
        autocomplete="email"
        inputmode="email"
        errorText="Informe um e-mail válido."
      />
      <ion-input
        formControlName="password"
        type="password"
        label="Senha"
        labelPlacement="floating"
        fill="outline"
        autocomplete="current-password"
        errorText="Informe sua senha."
      >
        <ion-input-password-toggle slot="end" showIcon="tg-eye" hideIcon="tg-eye-slash" />
      </ion-input>
    </ion-list>

    @if (error(); as message) {
      <div class="tg-alert tg-alert--danger" role="alert">
        <ion-icon name="tg-warning-circle" aria-hidden="true" />
        <p>{{ message }}</p>
      </div>
    }

    <ion-button type="submit" expand="block" [disabled]="submitting()">
      @if (submitting()) {
        <ion-spinner name="crescent" />
      } @else {
        Entrar
      }
    </ion-button>
  </form>
</ion-content>
