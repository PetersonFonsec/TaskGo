<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/" text="" /></ion-buttons>
    <ion-title>Entrar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list lines="none">
      <ion-input
        formControlName="email"
        type="email"
        label="E-mail"
        labelPlacement="floating"
        fill="outline"
        autocomplete="email"
        inputmode="email"
        errorText="Informe um e-mail válido."
      />
      <br />
      <ion-input
        formControlName="password"
        type="password"
        label="Senha"
        labelPlacement="floating"
        fill="outline"
        autocomplete="current-password"
        errorText="Informe sua senha."
      >
        <ion-input-password-toggle slot="end" />
      </ion-input>
    </ion-list>

    @if (error(); as message) {
      <ion-text color="danger" role="alert"><p>{{ message }}</p></ion-text>
    }

    <ion-button type="submit" expand="block" [disabled]="submitting()">
      @if (submitting()) {
        <ion-spinner name="crescent" />
      } @else {
        Entrar
      }
    </ion-button>
  </form>
</ion-content>
