name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'
  NG_BUILD_MAX_WORKERS: '2'
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskgo_ci
          POSTGRES_PASSWORD: taskgo_ci
          POSTGRES_DB: taskgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskgo_ci -d taskgo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://taskgo_ci:taskgo_ci@localhost:5432/taskgo_test?schema=public
      JWT_SECRET: ci-only-not-a-secret
      PAYMENTS_SIMULATION: 'true'
      SALT_ROUNDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Prepare isolated test database
        run: |
          node -e 'require("node:fs").writeFileSync("apps/backend/.env.test", ["DATABASE_URL=" + process.env.DATABASE_URL, "JWT_SECRET=" + process.env.JWT_SECRET, "PAYMENTS_SIMULATION=true", "SALT_ROUNDS=1", ""].join(String.fromCharCode(10)))'
          npm exec --workspace apps/backend -- prisma generate
          npm run prisma:deploy --workspace apps/backend
      - name: Lint backend
        run: npm run lint -- --skip-nx-cache
      - name: Check shared types
        run: npx nx run shared:typecheck --skip-nx-cache
      - name: Test shared contracts
        run: npx nx run shared:test --skip-nx-cache
      - name: Test backend including database integrations
        run: npm run test:ci --workspace apps/backend
      - name: Test frontend in ChromeHeadless
        run: npm run test:ci --workspace apps/frontend
      - name: Test backoffice in ChromeHeadless
        run: npm run backoffice:test -- --skip-nx-cache
      - name: Build all applications
        run: npm run build -- --skip-nx-cache --parallel=1

  auth-e2e:
    name: Auth E2E (API real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskgo_ci
          POSTGRES_PASSWORD: taskgo_ci
          POSTGRES_DB: taskgo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskgo_ci -d taskgo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYPRESS_INSTALL_BINARY: ''
      DATABASE_URL: postgresql://taskgo_ci:taskgo_ci@localhost:5432/taskgo_e2e?schema=public
      JWT_SECRET: ci-only-not-a-secret
      PAYMENTS_SIMULATION: 'true'
      SALT_ROUNDS: '1'
      NODE_ENV: test
      PORT: '3000'
      PUBLIC_FRONTEND_ORIGINS: http://localhost:4200
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and Cypress binary
        run: npm ci
      - name: Migrate and seed database
        run: |
          npm exec --workspace apps/backend -- prisma generate
          npm run prisma:deploy --workspace apps/backend
          ALLOW_DEMO_SEED=true npm run prisma:seed --workspace apps/backend
      - name: Start API and frontend
        run: |
          npm run build --workspace apps/backend
          (cd apps/backend && nohup node dist/apps/backend/src/main.js > ../../backend.log 2>&1 &)
          (cd apps/frontend && nohup npx ng serve --port 4200 > ../../frontend.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf http://localhost:3000/categories > /dev/null && curl -sf http://localhost:4200 > /dev/null && exit 0
            sleep 5
          done
          tail -50 backend.log frontend.log
          exit 1
      - name: Run auth E2E against the API
        run: npm run cypress:run:api --workspace apps/frontend
      - name: Upload logs and videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-artifacts
          path: |
            backend.log
            frontend.log
            apps/frontend/cypress/videos
            apps/frontend/cypress/screenshots
